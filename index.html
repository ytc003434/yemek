<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Yakın">
<meta name="theme-color" content="#F5F6F1">
<title>Yakın</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F5F6F1;--card:#FFFFFF;--ink:#15171A;--mute:#7A7F87;--line:#E6E8E1;--lime:#C6F53A;--lime2:#A6DB1F;--limedeep:#5E8A00;--grey:#C9CDD4;--pinkl:#FFB4D1;--pink:#FF5FA2}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
  #app{height:100dvh;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 12px);position:relative;overflow:hidden}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5}
  #flash.on{animation:flash .55s ease-out}
  @keyframes flash{0%{opacity:.9}100%{opacity:0}}
  #app.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}

  header{display:flex;justify-content:space-between;align-items:flex-start;flex:none}
  .stat{font-size:13px;font-weight:700;color:var(--mute);letter-spacing:-.01em}
  .stat b{font-size:34px;line-height:1;display:block;font-weight:800;color:var(--ink);letter-spacing:-.04em}
  .stat.s b{background:var(--lime);border-radius:10px;padding:2px 8px;display:inline-block;margin-bottom:4px}
  .stat.r{text-align:right}
  .rank{flex:none}
  .rank .name{font-size:15px;font-weight:800;letter-spacing:-.02em}
  .rank .name span{color:var(--mute);font-weight:700;font-size:12px;margin-left:8px}
  .bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .6s cubic-bezier(.2,.8,.2,1)}

  .slots{display:flex;gap:6px;flex:none}
  #acts .slot{min-height:46px;padding:7px 10px} #acts .slot b{font-size:13px}
  .slot.lift.done{background:#DCE3FF;border-color:#DCE3FF} .slot.lift .fill{background:#B9C6FF}
  .slot.cardio.done{background:#FFE1B8;border-color:#FFE1B8} .slot.cardio .fill{background:#FFC98A}
  .slot{flex:1;border-radius:14px;padding:9px 10px;background:var(--card);font-size:11px;font-weight:700;color:var(--mute);border:1px solid var(--line);position:relative;overflow:hidden;min-height:54px}
  .slot b{display:block;font-size:14px;color:var(--ink);margin-top:1px;position:relative;letter-spacing:-.02em}
  .slot.good{background:var(--lime);border-color:var(--lime);color:var(--limedeep)}
  .slot.bad{background:var(--grey);border-color:var(--grey);color:#5B6068}
  .slot.now{border-color:var(--ink)} .slot.miss{opacity:.45}
  #pill{cursor:pointer;touch-action:none}
  #pill .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--pinkl);transition:height .05s linear}
  #pill.done{background:var(--pinkl);border-color:var(--pinkl)}
  #pill span.e{position:relative;font-size:12px}

  main{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;position:relative}
  #card{width:100%;max-width:360px;border-radius:28px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;padding:14px 16px;position:relative;will-change:transform;cursor:grab;box-shadow:0 24px 50px -30px rgba(21,23,26,.25);min-height:0}
  #card.snap{transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
  #scene{flex:1;min-height:0;width:100%;border-radius:18px;display:block}
  .dist{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;flex:none}
  .dist b{font-size:24px;font-weight:800;letter-spacing:-.04em}
  .dist span{font-size:12px;font-weight:700;color:var(--mute);text-align:right}
  #card h1{font-size:19px;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-top:6px;flex:none}
  .hint{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);margin-top:6px;flex:none}
  .hint .r{color:var(--limedeep)} .hint .l{color:#5B6068}
  #tint{position:absolute;inset:0;border-radius:28px;opacity:0;pointer-events:none}

  #rise{position:fixed;inset:0;pointer-events:none;z-index:6;display:flex;align-items:center;justify-content:center}
  .word{position:absolute;font-weight:800;text-align:center;letter-spacing:-.04em;white-space:nowrap;animation:rise 1.4s cubic-bezier(.1,.9,.3,1) forwards;padding:4px 14px;border-radius:14px}
  .word.big{font-size:40px;color:var(--ink);background:var(--lime)}
  .word.huge{font-size:44px;color:var(--lime);background:var(--ink);animation-duration:2.2s}
  .word.pinkw{font-size:40px;color:var(--ink);background:var(--pinkl);animation-duration:2.2s}
  .word.cool{font-size:24px;color:var(--ink);background:var(--grey)}
  .word.xp{font-size:18px;color:var(--mute);margin-top:70px;animation-duration:1.1s}
  @keyframes rise{0%{transform:translateY(60px) scale(.7);opacity:0}15%{opacity:1;transform:translateY(0) scale(1.05)}75%{opacity:1}100%{transform:translateY(-220px) scale(1);opacity:0}}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:4}

  footer{display:flex;flex-direction:column;gap:8px;flex:none}
  .weeklabel{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute)}
  #grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .col{display:flex;flex-direction:column;gap:5px;align-items:center}
  .col small{font-size:10px;font-weight:700;color:var(--mute)}
  .col.today small{color:var(--ink)}
  .d{width:100%;aspect-ratio:1;border-radius:50%;background:var(--line);transition:transform .3s,background .3s;position:relative;display:flex;align-items:center;justify-content:center;font-size:13px}
  .d.good{background:var(--lime)} .d.bad{background:var(--grey)} .d.cheat{background:var(--card);border:2px solid var(--ink)}
  .slot.cheat{background:var(--card);border-color:var(--ink)}
  .d.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .d .pe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
  @keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
  .row{display:flex;justify-content:center;gap:2px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:700;font-size:12px;color:var(--mute);background:none;border:none;padding:6px 9px;cursor:pointer}
  .btn:disabled{opacity:.3} .btn.on{color:var(--ink)}

  .sheet{position:fixed;inset:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 24px);display:none;flex-direction:column;gap:18px;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .sheet.open{display:flex}
  .sheet h2{font-size:30px;font-weight:800;letter-spacing:-.04em}
  .sheet h3{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:8px}
  .hist{display:flex;gap:10px;align-items:flex-end;height:100px}
  .hist div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mute)}
  .hist i{display:block;width:100%;border-radius:8px;background:var(--lime);min-height:4px}
  .cal{display:flex;flex-direction:column;gap:8px}
  .cal a{display:flex;justify-content:space-between;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px}
  .cal a span{color:var(--mute);font-size:12px}
  .note{font-size:13px;color:var(--mute);line-height:1.45;font-weight:600}
  .pillb{align-self:flex-start;font:inherit;font-weight:800;font-size:14px;border:none;border-radius:999px;padding:12px 18px;cursor:pointer;color:var(--ink);background:var(--lime)}
  .pillb.ghost{background:var(--card);border:1px solid var(--line)} .pillb:disabled{opacity:.4}
  .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .f{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .f label{display:block;font-size:11px;font-weight:700;color:var(--mute)}
  .f input{width:100%;font:inherit;font-weight:800;font-size:20px;color:var(--ink);background:none;border:none;outline:none;margin-top:2px;letter-spacing:-.02em}
  .kpi{display:flex;gap:16px;flex-wrap:wrap}
  .kpi div{font-size:12px;font-weight:700;color:var(--mute)} .kpi b{display:block;font-size:24px;color:var(--ink);font-weight:800;letter-spacing:-.03em}
  .gal{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;touch-action:pan-x}
  .gal figure{flex:none;width:120px}
  .gal img{width:120px;height:160px;object-fit:cover;border-radius:14px;display:block;background:var(--line)}
  .gal figcaption{font-size:11px;font-weight:700;color:var(--mute);margin-top:6px;text-align:center}
  #wchart{width:100%;height:70px;display:block}
  @media (prefers-reduced-motion:reduce){.word,.d.pop,#flash.on,#app.shake{animation:none}}
</style>
</head>
<body>
<div id="flash"></div>
<canvas id="fx"></canvas>
<div id="rise"></div>

<div id="app">
  <header>
    <div class="stat s"><b id="streak">0</b>seri</div>
    <div class="stat r"><b id="rate">—</b>bu hafta</div>
  </header>
  <div class="rank">
    <div class="name"><span id="rankName" style="color:var(--bone);font-size:15px;margin:0"></span><span id="xpTxt"></span></div>
    <div class="bar"><i id="xpBar"></i></div>
  </div>
  <div class="slots" id="slots"></div>
  <div class="slots" id="acts"></div>

  <main>
    <div id="card">
      <div id="tint"></div>
      <svg id="scene" viewBox="0 0 340 210" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="dist"><b id="distPct">0%</b><span id="distTxt"></span></div>
      <h1 id="title">Yemek yedin. Nasıldı?</h1>
      <div class="hint"><span class="l" id="hintL">← kötü</span><span class="r">iyi →</span></div>
    </div>
  </main>

  <footer>
    <div class="weeklabel"><span id="wk"></span><span id="cnt">0 / 21</span></div>
    <div id="grid"></div>
    <div class="row">
      <button class="btn" id="undo" disabled>geri al</button>
      <button class="btn" id="snd">ses: açık</button>
      <button class="btn" id="prof">profil</button>
      <button class="btn" id="stats">özet & bildirim</button>
    </div>
  </footer>
</div>

<div id="sheet" class="sheet">
  <h2>Özet</h2>
  <div><h3>Son 6 hafta — iyi yemek</h3><div class="hist" id="hist"></div></div>
  <div class="kpi" id="kpi"></div>
  <div>
    <h3>Bildirimler</h3>
    <p class="note" id="notifState"></p>
    <div class="row" style="justify-content:flex-start;gap:10px;margin-top:10px">
      <button class="pillb" id="askNotif">Bildirimlere izin ver</button>
      <button class="pillb ghost" id="testNotif">Test et</button>
    </div>
  </div>
  <div>
    <h3>Kapalıyken de gelsin — Google Takvim</h3>
    <p class="note">Dördüne de bas, her biri günlük tekrarlayan hatırlatıcı açar; kaydet.</p>
    <div class="cal" id="cal" style="margin-top:10px"></div>
  </div>
  <button class="pillb ghost" id="share">Haftayı paylaş</button>
  <button class="pillb ghost" id="close">Kapat</button>
</div>

<div id="psheet" class="sheet">
  <h2>Profil</h2>
  <div class="fields">
    <div class="f"><label>boy (cm)</label><input id="hgt" type="number" inputmode="numeric" placeholder="—"></div>
    <div class="f"><label>kilo (kg)</label><input id="wgt" type="number" inputmode="decimal" step="0.1" placeholder="—"></div>
    <div class="f"><label>hedef (kg)</label><input id="goal" type="number" inputmode="decimal" step="0.1" placeholder="—"></div>
  </div>
  <div class="kpi" id="pkpi"></div>
  <div><h3>Kilo seyri</h3><svg id="wchart" viewBox="0 0 300 70" preserveAspectRatio="none"></svg></div>
  <div>
    <h3>Aylık foto — ayda 1</h3>
    <p class="note" id="photoNote"></p>
    <input type="file" id="photoIn" accept="image/*" style="display:none">
    <button class="pillb" id="photoBtn" style="margin-top:10px">Bu ayın fotosunu yükle</button>
    <div class="gal" id="gal" style="margin-top:12px"></div>
  </div>
  <button class="pillb ghost" id="pclose">Kapat</button>
</div>

<script>
// ---------- storage ----------
const KEY='yemek_log_v2', SKEY='yemek_settings';
let log=[], st={sound:true,notified:{},fit:18,pills:[],hgt:'',goal:'',weights:[],photos:[],processed:0,cheats:0,weekDone:0,lift:[],cardio:[]};
try{ log=JSON.parse(localStorage.getItem(KEY)||'[]'); st=Object.assign(st,JSON.parse(localStorage.getItem(SKEY)||'{}')); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(log)); localStorage.setItem(SKEY,JSON.stringify(st)); return true; }catch(e){ return false; } }

// ---------- time ----------
const SLOTS=[{h:8,m:30,n:'Kahvaltı'},{h:14,m:0,n:'Öğle'},{h:20,m:0,n:'Akşam'}];
const PILL={h:23,m:0,n:'F+M'};
function weekStart(d=new Date()){ const x=new Date(d); x.setHours(0,0,0,0); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
const dayStart=(d=new Date())=>{ const x=new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
const inWeek=ws=>log.filter(e=>e.t>=ws&&e.t<ws+7*864e5);
const thisWeek=()=>inWeek(weekStart().getTime());
const today=()=>log.filter(e=>e.t>=dayStart());

const hhmm=(h,m)=>`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));


// ---------- günlük aksiyonlar: F+M / ağırlık / kardiyo ----------
const ACTS=[
 {k:'pills',cls:'pill',e:'💊',n:'F+M',fit:8,xp:15,word:'+15 SAÇ KÖKÜ',wcls:'pinkw',cols:['#FFB4D1','#FF5FA2','#15171A','#C6F53A'],flash:'rgba(255,180,209,.9)',weekly:false},
 {k:'lift',cls:'lift',e:'🏋️',n:'Ağırlık',fit:7,xp:20,word:'KAS DOLUYOR',wcls:'huge',cols:['#B9C6FF','#4A6CFF','#15171A','#C6F53A'],flash:'rgba(185,198,255,.9)',weekly:true},
 {k:'cardio',cls:'cardio',e:'🏃',n:'Kardiyo',fit:6,xp:20,word:'KALP ATIYOR',wcls:'huge',cols:['#FFC98A','#FF8A1A','#15171A','#C6F53A'],flash:'rgba(255,201,138,.9)',weekly:true}];
const actToday=k=>st[k].some(t=>t>=dayStart());
const actWeek=k=>st[k].filter(t=>t>=weekStart().getTime()).length;
function actStreak(k){ let s=0, d=dayStart(); if(!actToday(k)) d-=864e5; while(st[k].some(t=>t>=d&&t<d+864e5)){ s++; d-=864e5; } return s; }

// ---------- xp / rank ----------
const RANKS=[[0,'Çaylak'],[100,'Düzenli'],[300,'Disiplinli'],[700,'Makine'],[1500,'Efsane'],[3000,'Başka Boyut']];
function xp(){ let x=0,s=0; for(const e of log){ if(e.good){ s++; x+=(10+Math.min(s,10)*2)*(e.jackpot?3:1); } else if(!e.cheat) s=0; } return x+st.pills.length*15+(st.lift.length+st.cardio.length)*20; }
function streakNow(){ let s=0; for(let i=log.length-1;i>=0;i--){ if(log[i].good) s++; else if(!log[i].cheat) break; } return s; }
function rankOf(x){ let i=0; while(i+1<RANKS.length&&x>=RANKS[i+1][0]) i++; return i; }
const pillToday=()=>actToday('pills'); const pillStreak=()=>actStreak('pills');

// ---------- copy ----------
const GOOD=["YAKLAŞTIN","GLOW +1","YÜZÜN PARLIYOR","FOTOLARDA NET","CİLT LEVEL UP","TEMİZ ENERJİ","ÇENE HATTI GELİYOR","BUGÜN KAZANDIN","MAKİNE GİBİ","ATEŞ ATEŞ","DİSİPLİN = ÖZGÜRLÜK","KIZLAR FARK ETTİ"];
const STREAK={3:"3 SERİ — ISINDIN",5:"5 SERİ — RİTİM TUTTU",10:"10 SERİ — DURDURULAMAZ",21:"21 SERİ — TAM HAFTA"};
const MILESTONE={7:"7 İYİ — 1/3 GİTTİ",14:"14 İYİ — GÖRÜNÜYOR",21:"21/21 — MÜKEMMEL HAFTA"};
const BAD=["Kayıt alındı.","Oldu bir kere.","Sıfırlıyoruz.","Sonraki yemek seninki.","Sessiz. Geçti."];
const TITLES=["Yemek yedin. Nasıldı?","Sıradaki. Ne yedin?","Bir tane daha. Nasıldı?"];
const DIST=p=>p<.15?'aynı şehirde bile değiller':p<.3?'uzaktan bakıyorlar':p<.45?'fark ettiler':p<.6?'göz teması':p<.75?'yaklaşıyorlar':p<.9?'konuşma mesafesi':p<1?'yan yana':'parti başladı';

// ---------- sound ----------
let ac, unlocked=false;
function A(){ if(!st.sound) return null; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }catch(e){ return null; } }
function unlock(){ const a=A(); if(!a||unlocked) return; try{ const b=a.createBuffer(1,1,22050), s=a.createBufferSource(); s.buffer=b; s.connect(a.destination); s.start(0); unlocked=true; }catch(e){} }
['touchend','mouseup','click','keydown'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
function tone(f,t0,dur,type='sine',g=.18){ const a=A(); if(!a) return; const o=a.createOscillator(), v=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,a.currentTime+t0);
  v.gain.setValueAtTime(0,a.currentTime+t0); v.gain.linearRampToValueAtTime(g,a.currentTime+t0+.01); v.gain.exponentialRampToValueAtTime(.001,a.currentTime+t0+dur);
  o.connect(v).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+dur+.05); }
const sGood=()=>{ [523,659,784,1046].forEach((f,i)=>tone(f,i*.06,.35,'triangle')); tone(1568,.26,.5,'sine',.08); };
const sHuge=()=>{ [392,523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.08,.6,'triangle',.2)); [784,1046].forEach((f,i)=>tone(f,.6+i*.1,1.2,'sine',.12)); };
const sBad=()=>{ tone(180,0,.25,'sawtooth',.08); tone(120,.08,.35,'sine',.12); };
const sTick=()=>tone(900,0,.05,'square',.04);
const sCharge=k=>tone(200+k*900,0,.08,'sine',.05);

// ---------- scene (yol: solda erkekler, sağda kızlar) ----------
const $=id=>document.getElementById(id);
const L=(a,b,t)=>a+(b-a)*t;
function man(x,y,s,c,i){ return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="62" rx="14" ry="3" fill="#000" opacity=".25"/>
  <rect x="-6" y="34" width="5" height="26" rx="2.5" fill="${c}"/><rect x="1" y="34" width="5" height="26" rx="2.5" fill="${c}"/>
  <path d="M -11 12 h 22 l -3 24 h -16 z" fill="${c}"/><rect x="-16" y="13" width="5" height="18" rx="2.5" fill="${c}" transform="rotate(${i?-8:8} -13 13)"/><rect x="11" y="13" width="5" height="18" rx="2.5" fill="${c}" transform="rotate(${i?8:-8} 13 13)"/>
  <circle cx="0" cy="2" r="8" fill="#E2AE84"/><path d="M -8 0 q 8 -10 16 0 q -8 -3 -16 0 z" fill="#2A1B36"/></g>`; }
function woman(x,y,s,hair,dress,i){ return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="62" rx="14" ry="3" fill="#000" opacity=".25"/>
  <rect x="-5" y="40" width="4" height="20" rx="2" fill="#E2AE84"/><rect x="1" y="40" width="4" height="20" rx="2" fill="#E2AE84"/>
  <path d="M -7 12 h 14 l 8 30 h -30 z" fill="${dress}"/><rect x="-14" y="13" width="4.5" height="17" rx="2.2" fill="#E2AE84" transform="rotate(${i?12:-4} -12 13)"/><rect x="9.5" y="13" width="4.5" height="17" rx="2.2" fill="#E2AE84" transform="rotate(${i?4:-12} 12 13)"/>

// ---------- profile ----------
const monthKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const MON=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function renderProfile(){
  $('hgt').value=st.hgt||''; $('goal').value=st.goal||''; const lw=st.weights[st.weights.length-1]; $('wgt').value=lw?lw.kg:'';
  let k=''; if(lw&&st.hgt){ const bmi=lw.kg/Math.pow(st.hgt/100,2); k+=`<div><b>${bmi.toFixed(1)}</b>bmi</div>`; }
  if(st.weights.length>1){ const d=lw.kg-st.weights[0].kg; k+=`<div><b>${d>0?'+':''}${d.toFixed(1)}</b>kg başlangıçtan</div>`; }
  if(lw&&st.goal){ k+=`<div><b>${(lw.kg-st.goal).toFixed(1)}</b>kg hedefe</div>`; }
  k+=`<div><b>${st.photos.length}</b>aylık foto</div>`; $('pkpi').innerHTML=k;
  const c=$('wchart'); const ws=st.weights.slice(-24); if(ws.length<2){ c.innerHTML=`<text x="0" y="40" fill="#7A7F87" font-size="11" font-weight="700">kilo girdikçe çizgi oluşur</text>`; }
  else{ const min=Math.min(...ws.map(w=>w.kg),st.goal?+st.goal:Infinity)-1, max=Math.max(...ws.map(w=>w.kg))+1;
    const pts=ws.map((w,i)=>[i/(ws.length-1)*300, 65-(w.kg-min)/(max-min)*60]); const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const gy=st.goal?65-(st.goal-min)/(max-min)*60:null;
    c.innerHTML=`${gy!==null?`<line x1="0" x2="300" y1="${gy}" y2="${gy}" stroke="#15171A" stroke-dasharray="4 4" opacity=".4"/>`:''}<path d="${d}" fill="none" stroke="#15171A" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#C6F53A" stroke="#15171A" stroke-width="1.5"/>`).join('')}`; }
  const has=st.photos.some(p=>p.m===monthKey()); $('photoBtn').disabled=has;
  const nx=new Date(); nx.setMonth(nx.getMonth()+1,1); $('photoNote').textContent=has?`Bu ayın fotosu yüklendi. Sıradaki: 1 ${MON[nx.getMonth()]}.`:'Aynı ışık, aynı poz, aynı ayna. Ayda bir; sonra yan yana bak.';
  const g=$('gal'); g.innerHTML=''; [...st.photos].reverse().forEach(p=>{ const [y,m]=p.m.split('-'); const f=document.createElement('figure'); f.innerHTML=`<img src="${p.d}" alt=""><figcaption>${MON[+m-1]} ${y}</figcaption>`; g.appendChild(f); });
}
$('prof').onclick=()=>{ renderProfile(); $('psheet').classList.add('open'); }; $('pclose').onclick=()=>$('psheet').classList.remove('open');
$('hgt').onchange=e=>{ st.hgt=e.target.value; save(); renderProfile(); };
$('goal').onchange=e=>{ st.goal=e.target.value; save(); renderProfile(); };
$('wgt').onchange=e=>{ const kg=parseFloat(e.target.value); if(!kg) return; const lw=st.weights[st.weights.length-1]; if(lw&&lw.t>=dayStart()) lw.kg=kg; else st.weights.push({t:Date.now(),kg}); save(); renderProfile(); sGood(); };
$('photoBtn').onclick=()=>$('photoIn').click();
$('photoIn').onchange=e=>{ const file=e.target.files[0]; if(!file) return; const img=new Image(); const u=URL.createObjectURL(file);
  img.onload=()=>{ const s=Math.min(1,720/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',.72); URL.revokeObjectURL(u); st.photos=st.photos.filter(p=>p.m!==monthKey()); st.photos.push({m:monthKey(),d});
    if(!save()){ st.photos.pop(); alert('Depolama doldu, foto kaydedilemedi.'); return; } renderProfile(); flash('radial-gradient(circle, rgba(198,245,58,.6), transparent 60%)'); sGood(); word('AYLIK FOTO ✓','big'); e.target.value=''; };
  img.src=u; };


// ---------- gün sonu cezası & haftalık serbest kart ----------
function processDays(){
  if(!log.length&&!st.pills.length) return; const first=dayStart(new Date(Math.min(log[0]?log[0].t:Infinity, st.pills[0]||Infinity)));
  let d=Math.max(st.processed||0, first), lost=0, missedDays=0; const todayS=dayStart();
  while(d<todayS){ const meals=log.filter(e=>e.t>=d&&e.t<d+864e5).length; const miss=Math.max(0,3-meals); if(miss){ lost+=miss*3; missedDays++; } d+=864e5; }
  st.processed=todayS;
  // hafta bitti mi?
  const ws=weekStart().getTime(); if((st.weekDone||0)<ws){ const prev=inWeek(ws-7*864e5); const g=prev.filter(e=>e.good).length; const started=prev.length>0||(st.weekDone||0)>0;
    if(started&&g>=18){ st.cheats=(st.cheats||0)+1; setTimeout(()=>{ word(`HAFTA ${g}/21 · SERBEST KART +1`,'huge'); burst(180,['#fff','#C6F53A','#15171A'],innerWidth/2,innerHeight*.45,5,10); sHuge(); vib([60,40,60,40,200]); },1400); }
    st.weekDone=ws; }
  if(lost){ st.fit=clamp(st.fit-lost,0,100); setTimeout(()=>{ word(`−${lost} yakınlık · ${missedDays} gün eksik kayıt`,'cool'); sBad(); vib(30); setFit(st.fit); },600); }
  save();
}

// ---------- boot ----------
processDays(); render(); setFit(st.fit,false); checkSlots();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ processDays(); checkSlots(); } });
</script>
</body>
